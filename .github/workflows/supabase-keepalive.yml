name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 09:00 UTC every 3 days to prevent Supabase Free Plan 7-day inactivity pause
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase PostgREST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Strip any surrounding quotes or trailing slashes
          CLEAN_URL=$(echo "${SUPABASE_URL}" | tr -d '"' | tr -d "'" | sed 's:/*$::')
          CLEAN_KEY=$(echo "${SUPABASE_KEY}" | tr -d '"' | tr -d "'")

          if [ -z "${CLEAN_URL}" ] || [ -z "${CLEAN_KEY}" ]; then
            echo "::error::Missing Supabase credentials. Please add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY) to GitHub Repository Secrets."
            exit 1
          fi

          echo "Pinging Supabase REST endpoint at ${CLEAN_URL}/rest/v1/ ..."

          SCHEMA_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -o "${SCHEMA_FILE}" -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}" \
            "${CLEAN_URL}/rest/v1/" || echo "000")

          echo "PostgREST /rest/v1/ root responded with HTTP ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" = "000" ] || [ "${HTTP_STATUS}" -ge 500 ]; then
            echo "::error::Supabase keep-alive failed with HTTP ${HTTP_STATUS}"
            cat "${SCHEMA_FILE}" || true
            rm -f "${SCHEMA_FILE}"
            exit 1
          fi

          # Dynamically discover an exposed table from the OpenAPI spec and run a lightweight SELECT LIMIT 1
          # so Postgres registers active table query traffic across any project (ALBUMEVI, IMPA, etc.)
          TABLE_PATH=""
          if command -v jq >/dev/null 2>&1 && [ "${HTTP_STATUS}" = "200" ]; then
            TABLE_PATH=$(jq -r '.paths | keys[]? | select(. != "/" and (startswith("/rpc/") | not))' "${SCHEMA_FILE}" 2>/dev/null | head -n 1 || true)
          fi
          rm -f "${SCHEMA_FILE}"

          if [ -n "${TABLE_PATH}" ]; then
            echo "Executing lightweight SELECT query on /rest/v1${TABLE_PATH}?limit=1 ..."
            QUERY_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 15 \
              --max-time 30 \
              -H "apikey: ${CLEAN_KEY}" \
              -H "Authorization: Bearer ${CLEAN_KEY}" \
              "${CLEAN_URL}/rest/v1${TABLE_PATH}?limit=1" || echo "000")

            echo "Table query responded with HTTP ${QUERY_STATUS}"

            if [ "${QUERY_STATUS}" = "000" ] || [ "${QUERY_STATUS}" -ge 500 ]; then
              echo "::error::Supabase table query failed with HTTP ${QUERY_STATUS}"
              exit 1
            fi
          fi

          echo "Supabase keep-alive ping completed successfully at $(date -u +"%Y-%m-%dT%H:%M:%SZ")."
